<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MagniVila — Jogar</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#327c88,#142b42 75%);color:#edfafa;font:17px system-ui;padding:24px}main{width:min(100%,480px);padding:40px 28px;border:1px solid #77cad077;border-radius:24px;background:#193d50;box-shadow:0 24px 70px #0005;text-align:center}.badge{color:#a5e6d4;font-size:13px;letter-spacing:2px}h1{font-size:44px;margin:18px 0 8px}p{line-height:1.6;color:#c7dee4}button{font:700 20px system-ui;background:#ffda83;color:#243847;border:0;border-radius:14px;padding:17px;width:100%;cursor:pointer;margin:20px 0}button:disabled{opacity:.6;cursor:wait}small{color:#b2cbd3}#status{min-height:3em;font-size:14px}</style></head><body><main><span class="badge">UMA CIDADE PARA ENCONTRAR AMIGOS</span><h1>MagniVila</h1><p>Explore a cidade, conheça pessoas e participe das primeiras aventuras.</p><button id="play">Jogar agora</button><p id="status" role="status">Versão de testes · este é o endereço para compartilhar.</p><small>O jogo fica disponível enquanto o servidor de testes estiver ligado.</small></main><script>const button=document.getElementById('play'),status=document.getElementById('status');button.onclick=async()=>{button.disabled=true;status.textContent='Buscando o servidor…';try{const r=await fetch('https://raw.githubusercontent.com/brunogondim12/magnivila-jogar/main/destination.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();if(!d.url){status.textContent='Servidor desligado no momento. Volte mais tarde.';return}const u=new URL(d.url);if(u.protocol!=='https:'||!/^[-a-z0-9]+\.trycloudflare\.com$/.test(u.hostname)||u.pathname!=='/'||u.search||u.hash||u.username||u.password)throw Error();location.assign(u.href)}catch{status.textContent='Não foi possível buscar o servidor. Tente novamente em instantes.'}finally{button.disabled=false}};</script></body></html>
